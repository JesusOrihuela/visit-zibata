<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Visit Zibatá · La guía local para descubrir Zibatá</title>
    <meta
      name="description"
      content="Descubre lo que hay en Zibatá, Querétaro: los negocios y lugares de cada zona en un mapa 3D, con horarios, contacto y cómo llegar."
    />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Los PNG van detrás del SVG y existen para quien no lo use. Sin ellos, cada consumidor
      rasteriza el vector al tamaño que elige: Search Console lo hace a 32 px y luego amplia, y el
      aro se escalona. 48 y 96 porque Google pide múltiplos de 48.
    -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Visit Zibatá" />
    <meta property="og:title" content="Visit Zibatá · La guía local para descubrir Zibatá" />
    <meta
      property="og:description"
      content="Descubre lo que hay en Zibatá, Querétaro: los negocios y lugares de cada zona en un mapa 3D, con horarios, contacto y cómo llegar."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Visit Zibatá: mapa de Zibatá con sus plazas, la guía local para descubrir todo lo que hay en la localidad."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>
      <p class="noscript">
        Esta guía interactiva de Zibatá necesita JavaScript para mostrar el mapa.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
