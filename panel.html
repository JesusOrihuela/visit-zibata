<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Página aparte de la guía, a propósito.

      Es una segunda entrada del build: comparte los tokens y la letra con la guía, pero no su
      paquete, porque no importa React ni el mapa. No se prerenderiza, no está en el sitemap y no se
      traduce: la lee una persona y siempre la misma.

      La protección no está aquí: la pone Cloudflare Access delante de /panel y de /api/panel (ver
      docs/DESPLIEGUE.md). El Worker además falla cerrado si no ve la cabecera que inyecta Access.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mesa de edición · Visit Zibatá</title>
  </head>
  <body>
    <a class="salto" href="#principal">Saltar al contenido</a>

    <div class="mesa">
      <aside class="rail" aria-label="Mesa de edición">
        <div class="marca-panel">
          <span class="marca-panel-nombre">Visit Zibatá</span>
          <span class="marca-panel-nota">Mesa de edición</span>
        </div>

        <nav class="menu" aria-label="Secciones">
          <button type="button" data-vista="resumen" aria-current="page">Resumen</button>
          <button type="button" data-vista="sugerencias">
            Sugerencias
            <span class="cuenta-menu" data-cuenta-sugerencias hidden></span>
          </button>
          <button type="button" data-vista="negocios">Negocios</button>
          <button type="button" data-vista="categorias">Categorías</button>
        </nav>

        <div class="rail-pie">
          <p class="rail-estado" data-estado-rama>Contenido sin cargar</p>
          <a class="rail-enlace" data-enlace-pr href="https://github.com/aurariola-studio/visit-zibata/pulls" target="_blank" rel="noreferrer" hidden>Ver la PR</a>
        </div>
      </aside>

      <main id="principal" class="principal">
        <header class="cabecera">
          <div class="cabecera-texto">
            <p class="antetitulo" data-antetitulo>La guía</p>
            <h1 data-titulo>Resumen</h1>
          </div>
          <div class="cabecera-acciones" data-acciones></div>
        </header>

        <div id="vista" class="vista" aria-live="polite" aria-busy="true" tabindex="-1">
          <p class="estado">Cargando…</p>
        </div>
      </main>
    </div>

    <dialog id="editor" class="editor" aria-labelledby="editor-titulo">
      <div class="editor-caja">
        <header class="editor-cabecera">
          <div>
            <p class="antetitulo" data-editor-antetitulo>Contenido</p>
            <h2 id="editor-titulo" data-editor-titulo>Editar</h2>
          </div>
          <button type="button" class="editor-cerrar" data-editor-cerrar>Cerrar</button>
        </header>
        <div class="editor-cuerpo" data-editor-cuerpo></div>
      </div>
    </dialog>

    <script type="module" src="/src/panel/panel.ts"></script>
  </body>
</html>
