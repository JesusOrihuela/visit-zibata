# Integración continua para pull requests: valida datos, calidad de código, tests y build.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Validar, testear y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validar datos comerciales
        run: npm run data:validate
      - name: Lint y formato (Biome)
        run: npm run lint
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Tests unitarios y de componentes (Vitest)
        run: npm test
      - name: Build de producción
        run: npm run build
      - name: Presupuesto de rendimiento
        run: npm run perf:budget

  e2e:
    name: E2E (Playwright, base ${{ matrix.base }}, ${{ matrix.grupo }})
    needs: checks
    runs-on: ubuntu-latest
    # Dos grupos con peso parecido, no dos mitades arbitrarias. Medido con el informe JSON de
    # Playwright: mapa, capas, responsive, medición, táctil y errores suman 31,6 minutos de prueba;
    # el resto (contenido, navegación, SEO) suma 27,0. Así cada trabajo ronda los 20 minutos en CI y
    # deja de acercarse al límite de 60 que canceló dos ejecuciones.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # La subruta se sigue probando: detecta rutas absolutas mal escritas antes de publicar, y
        # mantiene el proyecto portable a otro hosting.
        include:
          - base: '/'
            grupo: 'mapa'
            args: '--grep=@mapa'
          - base: '/'
            grupo: 'contenido'
            args: '--grep-invert=@mapa'
          - base: '/visit-zibata/'
            grupo: 'mapa'
            args: '--grep=@mapa'
          - base: '/visit-zibata/'
            grupo: 'contenido'
            args: '--grep-invert=@mapa'
    env:
      BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npx playwright test ${{ matrix.args }}
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 7

  secrets:
    name: Búsqueda de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Se usa el binario y no gitleaks-action: esa acción exige clave de licencia cuando el
      # repositorio vive en una organización, y desde el traslado a aurariola-studio vive en una.
      # El binario es el mismo escáner, MIT y sin clave. La versión va fijada, igual que las
      # acciones van fijadas por SHA.
      - name: Escanear con Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1
