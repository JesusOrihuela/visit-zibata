# Integración continua para pull requests: valida datos, calidad de código, tests y build.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Validar, testear y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validar datos comerciales
        run: npm run data:validate
      - name: Lint y formato (Biome)
        run: npm run lint
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Tests unitarios y de componentes (Vitest)
        run: npm test
      - name: Build de producción
        run: npm run build
      - name: Presupuesto de rendimiento
        run: npm run perf:budget

  # La imagen oficial de Playwright trae los navegadores y sus dependencias del sistema ya instalados, y
  # Playwright exige que su versión coincida con la del paquete (https://playwright.dev/docs/docker):
  # si no, no encuentra los ejecutables. Por eso la etiqueta sale del propio package-lock.json y no de un
  # número escrito a mano: cuando Dependabot suba Playwright, la imagen sube con él.
  playwright-version:
    name: Versión de Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.leer.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: leer
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  e2e:
    # Los cuatro nombres no se pueden cambiar sin tocar la regla de la rama `main` (Settings, Rules,
    # Rulesets): exige estas comprobaciones por su nombre exacto, y un nombre nuevo se quedaría
    # esperando para siempre.
    name: E2E (Playwright, base ${{ matrix.base }}, ${{ matrix.grupo }})
    needs: [checks, playwright-version]
    runs-on: ubuntu-latest
    # Dentro de la imagen oficial de Playwright (https://playwright.dev/docs/ci, "Via Containers"). Antes
    # cada trabajo instalaba los navegadores en el runner con `--with-deps`: apt tenía que bajar unos 119 MB
    # (181 paquetes, sobre todo de WebKit) del espejo de Ubuntu, que a veces va a unos 50 KB/s. Una vez
    # tardó 25 minutos, otra vez no llegó ni a los 12 con tres intentos, y ningún tope o reintento arregla
    # que la red esté lenta. La imagen se descarga del registro de Microsoft y no hay nada que instalar.
    # `--user 1001` es el de la documentación de Playwright (el usuario del runner, para que el
    # espacio de trabajo siga siendo escribible) y `--ipc=host` y `--init` los que recomienda para Chromium.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host --init
    # Red de seguridad por encima de todo lo demás. Playwright corta antes con `globalTimeout` (45
    # minutos, en playwright.config.ts) y los pasos tienen su propio tope, así que este solo salta si
    # algo se cuelga fuera de ellos.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # La subruta se sigue probando: detecta rutas absolutas mal escritas antes de publicar, y
        # mantiene el proyecto portable a otro hosting.
        #
        # Dos grupos por base. "mapa" son los archivos cuyas pruebas llevan `@mapa` en el título
        # (mapa, capas, responsive, medición, táctil y errores) y "contenido" es todo lo demás. En CI
        # "contenido" tarda más que en local (entre 23 y 35 minutos frente a 16 a 23 de "mapa"): al
        # final de cada ejecución el resumen del trabajo lista el tiempo por archivo, que es el dato
        # para repartirlos mejor si hace falta.
        include:
          - base: '/'
            grupo: 'mapa'
            args: '--grep=@mapa'
          - base: '/'
            grupo: 'contenido'
            args: '--grep-invert=@mapa'
          - base: '/visit-zibata/'
            grupo: 'mapa'
            args: '--grep=@mapa'
          - base: '/visit-zibata/'
            grupo: 'contenido'
            args: '--grep-invert=@mapa'
    env:
      BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
        timeout-minutes: 10
      - name: Build de producción
        run: npm run build
        timeout-minutes: 10
      - name: Pruebas E2E
        run: npx playwright test ${{ matrix.args }}
        timeout-minutes: 50
      - name: Tiempo de prueba por archivo
        if: ${{ !cancelled() }}
        run: node scripts/ci/resumen-tiempos.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 7

  secrets:
    name: Búsqueda de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Se usa el binario y no gitleaks-action: esa acción exige clave de licencia cuando el
      # repositorio vive en una organización, y desde el traslado a aurariola-studio vive en una.
      # El binario es el mismo escáner, MIT y sin clave. La versión va fijada, igual que las
      # acciones van fijadas por SHA.
      - name: Escanear con Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1
